name: umami
services:
  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    ports:
      - "${UMAMI_BIND_IP:-0.0.0.0}:8989:3000"
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?Set TWO_FACTOR_ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [default, backend]
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, 'http://localhost:3000/api/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    networks: [backend]
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
networks:
  default: {}
  backend:
    internal: true
volumes:
  umami-db-data: {}
