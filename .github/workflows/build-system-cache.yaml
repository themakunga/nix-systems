name: Build - Cache Build Systems
on:
  push:
    branches:
      - main
jobs:
  build-systems:
    name: Build ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: glaDOS
            os: ubuntu-latest
            type: nixos
            arch: arm64
          - host: Wheatley
            os: ubuntu-latest
            type: nixos
            arch: arm64
          - host: jehuty
            os: ubuntu-latest
            type: nixos
            arch: x86_64
          - host: motherbase
            os: ubuntu-latest
            type: nixos
            arch: x86_64
          - host: steamdeck
            os: ubuntu-latest
            type: nixox
            arch: x86_64
          - host: kanagawa
            os: macos-latest
            type: darwin
            arch: aarch64
          - host: mother-base
            os: macos-latest
            type: darwin
            arch: aarch64
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Configure QEMU - ARM
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Install Cachix
        uses: cachix/install-nix-action@v31
        with:
          github_action_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            ${{ runner.os == 'Linux' && 'extra-platforms = aarch64-linux' || '' }}
      - name: Setup Cache
        uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Compile nixOS systems
        if: matrix.type == 'nixos'
        run: nix build .#nixosConfigurations.${{matrix.host}}.config.system.build.toplevel --accept-flake-config --print-build-logs
      - name: Compile darwin systems
        if: matrix.type == 'darwin'
        run: nix build .#darwinConfigurations.${{matrix.host}}.system --accept-flake-config --print-build-logs
