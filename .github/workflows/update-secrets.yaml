name: Update Secrets and Trigger Patch Release
on:
  repository_dispatch:
    types: [update-secrets]
permissions:
  contents: write
  pull-requests: write
jobs:
  patch-release:
    name: Bump Patch and Update Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup SSH Agent for Private Repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.RELEASE_TOKEN }}
      - name: Calculate Next Patch Version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Último tag encontrado: $LATEST_TAG"

          if [[ $LATEST_TAG =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          else
              echo "No se pudo parsear el tag. Usando v0.0.1 por defecto."
              NEW_VERSION="v0.0.1"
          fi

          echo "Nueva versión calculada: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Update Secrets Input
        run: |
          git checkout -b release/${{ steps.version.outputs.new_version }}

          # Actualizamos el input del flake
          nix flake lock --update-input secrets
      - name: Commit and Push Release Branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add flake.lock

          git push origin release/${{ steps.version.outputs.new_version }}
