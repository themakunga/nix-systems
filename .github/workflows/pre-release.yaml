name: Pre-Release (Raspberry Pi Images)
on:
  workflow_run:
    workflows:
      - "Nix Build & Cachix Push"
    types:
      - completed
    branches:
      - pre-release/v*
permissions:
  contents: write
jobs:
  build:
    name: Build SD Image ${{matrix.target}}
    runs-on: ubuntu-24.04-arm # 🚀 Nativo
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        target: [aperture-science, black-mesa, valve]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux
            extra-substituters = https://nixos-hardware.cachix.org
            extra-trusted-public-keys = nixos-hardware.cachix.org-1:OqV48MwUzN0rmApeP5Dp/4hQv+8Uz7x1qPtd+6BaLgc=
      - name: Build SD Image
        run: |
          mkdir -p output
          echo "=> Building ${{ matrix.target }}..."
          make build-${{ matrix.target }}
          for file in result/sd-image/*.zst; do
            filename=$(basename "$file")
            cp -L "$file" "output/${{ matrix.target }}-$filename"
          done
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: output/*.zst
          retention-days: 1
  release:
    name: Tag and Publish Pre-Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Download Built Images
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: image-*
          merge-multiple: true
      - name: Extract Tag Name
        id: vars
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          TAG_NAME="${BRANCH#pre-release/}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: Upload Image to GitHub Pre-Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.RELEASE_TOKEN }}
          file: output/*.zst
          file_glob: true
          tag: ${{ steps.vars.outputs.tag_name }}
          release_name: "Pre-Release ${{ steps.vars.outputs.tag_name }}"
          prerelease: true
          overwrite: true
          body: |
            🚀 **Automated Pre-Release build**
            Imágenes de instalación generadas exitosamente desde la rama `${{ github.event.workflow_run.head_branch }}`.
            _Nota: Estas imágenes son para propósitos de prueba y reflejan el estado de `main` en el momento del timestamp._
