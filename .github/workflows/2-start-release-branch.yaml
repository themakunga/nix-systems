name: '2. Start Release (Develop -> Release Branch)'
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
jobs:
  create-release-branch:
    name: 'Create Release Branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Calculate Next Version
        run: |
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | grep -v "-" | head -n 1 || echo "v0.0.0")
          VERSION_CORE="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"
          BUMP="${{ inputs.bump_type }}"
          if [ "$BUMP" == "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" == "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEXT_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
      - name: Create Release Branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git fetch origin main
          if git diff --quiet origin/main..HEAD; then
            echo "❌ ERROR: No changes detected between 'develop' and 'main'."
            echo "You cannot create an empty release. Please merge new features into develop first."
            exit 1
          fi

          git checkout -B "release/${{ env.NEXT_VERSION }}"
          git push -f origin "release/${{ env.NEXT_VERSION }}"
          echo "✅ Successfully created and pushed branch release/${{ env.NEXT_VERSION }}"
