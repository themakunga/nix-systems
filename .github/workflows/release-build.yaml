name: Release - Build and Publish
on:
  push:
    branches:
      - "release/v*"
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [glados, wheatley]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup QEMU (ARM)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            extra-platforms = aarch64-linux
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Build SD Image
        run: |
          mkdir -p output
          echo "=> Building ${{ matrix.target }}..."
          make build-${{ matrix.target }}
          for file in result/sd-image/*.zst; do
            filename=$(basename "$file")
            cp -L "$file" "output/${{ matrix.target }}-$filename"
          done
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: output/*.zst
          retention-days: 1
  release:
    name: Tags, Publish and Merge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.ref }}
      - name: Download Built Images
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: image-*
          merge-multiple: true
      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Upload Image to GitHub Release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.RELEASE_TOKEN }}
          file: output/*.zst
          file_glob: true
          tag: ${{ steps.semantic.outputs.new_release_git_tag }}
          overwrite: true
      - name: Create Pull Request to main
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "chore(release): merge ${{ github.ref_name }} to main" \
            --body "Automated Pull Request to sync release back to main. [skip ci]"
