name: Release - Build and Publish
on:
  push:
    branches:
      - "release/v*"
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  build-and-release:
    name: Build, Tags and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup QEMU (ARM)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{secrets.SECRETS_REPO_SSH_KEY }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            extra-platforms = aarch64-linux
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{secrets.CACHIX_TOKEN }}
      - name: Build SD Image
        run: |
          make sd-image
          mkdir -p output
          cp -L result/sd-image/*.img.zst output/sd-image-rpi.img.zst
      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN  }}
      - name: Upload Image to GitHub Release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.RELEASE_TOKEN }}
          file: output/sd-image-rpi.img.zst
          asset_name: nixos-rpi-${{ steps.semantic.output.new_release_version }}.img.zst
          tag: ${{ steps.semantic.output.new_release_git_tag }}
          overwrite: true
      - name: Merge to develop and clean release branch
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge origin/${{ github.ref_name }} \
          --no-ff \
          -m "chore(release): merge ${{github.ref_name}} to develop [skip ci]"
          git push origin develop
          git push origin --tags
          git push origin --delete ${{ github.ref_name }}
