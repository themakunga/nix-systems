name: Release - Build and Publish
on:
  push:
    branches:
      - 'release/v*'
permissions:
  content: write
  issues: write
  pull-request: write
jobs:
  build-and-release:
    name: Build, Tags and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checout@v6
        with:
          fetch-depth: 0
      - name: Setup QEMU (ARM)
        uses: docker/setup-qemu-action@v4
        with:
          platfoms: arm64
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{secrets.SECRETS_REPO_SSH_KEY }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            extra-platforms = aarch64-linux
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: themakunga
          authToken: ${{secrets.CACHIX_TOKEN }}
      - name: Build SD Image
        run: |
          make sd-image
          mkdir -p output
          cp -L result/sd-image/*.img.zst output/sd-image-rpi.img.zst
      - name: Run Semantic Release
        id: semactic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GIHUB_TOKEN }}
      - name: Upload Image to GitHub Release
        if: steps.semantic.output.new_release_publisbh == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/sd-image-rpi.img.zst
          asset_name: nixos-rpi-${{ steps.semantic.output.new_release_version }}.img.zst
          tag: ${{ steps.semantic.output.new_release_git_tag }}
          overwrite: true
