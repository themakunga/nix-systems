name: 'Sync Develop to Issues'
on:
  push:
    branches:
      - develop
permissions:
  contents: write
jobs:
  sync-branches:
    name: Merge Develop into Issues Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge and Sync Changes
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/issues; then
            git checkout issues
            git pull origin issues
            git merge origin/develop -m "chore(todo): merge develop changes into issues [skip ci]" || (git merge --abort && echo "❌ Error: Merge conflict detected. Manual sync required.")
            git push origin issues
          fi
