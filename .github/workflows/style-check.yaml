name: "Nix Style & Lints"
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  linter:
    name: Check Style, Deadcode and Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7 # v4 es la versión estable actual
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run pre-commit on all files
        run: nix run nixpkgs#pre-commit -- run --all-files --color=always
