name: "Nix Style & Lints"
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  linter:
    name: Check Style, Deadcode and Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          featch-depth: 0
      - name: Install Nix using cachix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check formatting using alejandra
        run: nix run nixpkgs#alejandra -- --check .
      - name: Find dead code using Deadnix
        run: nix run nixpkgs#deadnix -- --fail .
      - name: Linter nix with Statix
        run: nix run nixpkgs#statix -- check .
