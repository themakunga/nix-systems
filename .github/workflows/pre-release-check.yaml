name: "Nix Flake Check (Pre-Release)"
on:
  pull_request:
    branches:
      - "release/v*"
jobs:
  flake-check:
    name: "Exhaustive Flake Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Verify PR source branch
        run: |
          echo "=> Checking source branch for the Pull Request..."
          if [[ ! "${{ github.head_ref }}" =~ ^pre-release/v.* ]]; then
            echo "::error::Strict Policy Violation: Pull Requests to release branches are ONLY permitted from 'pre-release/v*' branches. Current source: '${{ github.head_ref }}'."
            exit 1
          fi
          echo "Success: Pull Request originates from a valid pre-release branch."
      - name: Decode SSH Key
        run: |
          echo "${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}" | base64 -d > /tmp/raw_ssh_key
          echo "DECODED_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/raw_ssh_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          rm /tmp/raw_ssh_key
      - name: Setup SSH Agent for Private Flake Inputs
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.DECODED_KEY }}
      - name: Install Nix Package Manager
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run nix flake check
        run: |
          echo "=> Launching exhaustive nix flake check..."
          nix flake check --show-trace
