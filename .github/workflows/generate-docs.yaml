name: 'Auto-Generate Nix Documentation'
on:
  push:
    branches:
      - 'develop'
    paths:
      - 'modules/**'
      - 'flake.nix'
jobs:
  generate-and-commit-docs:
    name: 'Build & Commit MODULES.md'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build Documentation
        run: |
          echo "=> Construyendo la documentación del Flake..."
          nix build .#docs

          echo "=> Copiando el resultado a la raíz del repositorio..."
          cp result MODULES.md
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add MODULES.md

          if git diff --staged --quiet; then
            echo "✅ No hay cambios en la documentación. Omitiendo commit."
            exit 0
          fi

          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          MODIFIED_FILES=$(git diff --staged --name-only)

          COMMIT_TITLE="chore(docs): update documentation - $TIMESTAMP"

          COMMIT_BODY="Modified or included files:
          $MODIFIED_FILES

          [skip ci]"

          git commit -m "$COMMIT_TITLE" -m "$COMMIT_BODY"
          git push origin develop
