name: PR - Exhaustive Revision
on:
  pull_request:
    branches:
      - main
      - "release/v*"
jobs:
  pr-security-gate:
    name: Enforce Branches Flow
    runs-on: ubuntu-latest
    steps:
      - name: Verify Source Branch
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"

          if [[ "$TARGET" == "main" ]]; then
            if [[ ! "$SOURCE" =~ ^feature/ ]]; then
              echo "::error::Pull requests to 'main' must originate from 'feature/*' branches."
              exit 1
            fi
            echo "✅ Valid flow to main"
          elif [[ "$TARGET" =~ ^release/v ]]; then
            if [[ "$SOURCE" != "main" ]]; then
              echo "::error::Pull requests to 'release/v*' must originate from 'main'."
              exit 1
            fi
            echo "✅ Valid flow to release"
          fi
  exhaustive-evaluation:
    name: Dry-run Evaluation
    needs: pr-security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
      - name: Evaluate Hosts
        run: |
          nix eval .#nixosConfigurations --apply builtins.attrNames
          nix eval .#darwinConfigurations --apply builtins.attrNames
