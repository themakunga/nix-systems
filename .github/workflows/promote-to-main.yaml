# =========================================================
# Archivo de Configuración de NixOS / Home Manager
# Repositorio: TheMakunga Infrastructure
# Módulo auto-gestionado.
# =========================================================
# === DOCUMENTATION ===
# File: promote-to-main.yaml
# Path: ./.github/workflows/promote-to-main.yaml
# Description: Promueve develop a main creando un PR con el último informe de
#              seguridad y la lista de commits diferencia. Genera un pre-release
#              con los instaladores (RPi SD + Linux ISO) desde develop, sin
#              modificar el CHANGELOG ni re-ejecutar checks.
#              Solo se ejecuta vía workflow_dispatch.
# =====================
name: Promote develop to main
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
jobs:
  # ── 0. Preparar: calcular tag, crear PR ──────────────────────────────────
  prepare:
    name: Prepare — PR + tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Build PR body, create PR and set tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_SECRETS }}
        run: |
          TAG="pre-$(date +%Y%m%d%H%M)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Commits en develop que aún no están en main
          COMMITS=$(git log origin/main..HEAD --oneline 2>/dev/null || echo "(no new commits)")

          # Último issue de seguridad (label: security)
          SEC=$(gh issue list \
            --label security \
            --state all \
            --limit 1 \
            --json number,title,url,state \
            --jq '.[0] | if . then "Last scan: [#\(.number) — \(.title)](\(.url)) (\(.state))" else "No security issues on record." end')

          {
            printf '## Commit Diff (develop → main)\n```\n%s\n```\n\n' "$COMMITS"
            printf '## Security Report\n%s\n' "$SEC"
          } > /tmp/pr_body.md

          echo "=> Tag: ${TAG}"
          echo "=> PR body:"
          cat /tmp/pr_body.md

          # Crear PR — si ya existe, obtener su URL
          PR_URL=$(gh pr create \
            --base main \
            --head develop \
            --title "chore: promote develop → main" \
            --body-file /tmp/pr_body.md \
            --assignee themakunga \
            2>/dev/null \
            || gh pr list --base main --head develop --json url -q '.[0].url')

          echo "=> PR: ${PR_URL}"
  # ── 1. Build: RPi bootstrap SD image (aarch64) ──────────────────────────
  build-rpi:
    name: Pre-release — RPi SD image
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Decode SSH key
        run: |
          echo "${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}" | base64 -d > /tmp/ssh_key
          { printf 'DECODED_SSH_KEY<<EOF\n'; cat /tmp/ssh_key; printf '\nEOF\n'; } >> "$GITHUB_ENV"
          rm /tmp/ssh_key
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.DECODED_SSH_KEY }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            extra-platforms = aarch64-linux
            extra-substituters = https://cache.nixos.org https://themakunga.cachix.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= themakunga.cachix.org-1:6G4uSeEclXBILBnmlbDsTAapL2vE0ndx4laL02AzzR0=
      - uses: cachix/cachix-action@v15
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build aperture-bootstrap SD image
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          echo "=> Building aperture-bootstrap on $(uname -m)..."
          OUT=$(nix build .#nixosConfigurations.aperture-bootstrap.config.system.build.sdImage \
            --no-link --print-out-paths 2>&1 | tail -1)
          mkdir -p output
          for f in "$OUT"/sd-image/*; do
            [ -f "$f" ] && cp -L "$f" "output/aperture-bootstrap-${TAG}-$(basename "$f")"
          done
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: pre-rpi-sd-image
          path: output/*
          retention-days: 3
  # ── 2. Build: Linux x86_64 ISO ──────────────────────────────────────────
  build-linux:
    name: Pre-release — Linux ISO
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Decode SSH key
        run: |
          echo "${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}" | base64 -d > /tmp/ssh_key
          { printf 'DECODED_SSH_KEY<<EOF\n'; cat /tmp/ssh_key; printf '\nEOF\n'; } >> "$GITHUB_ENV"
          rm /tmp/ssh_key
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.DECODED_SSH_KEY }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            extra-substituters = https://cache.nixos.org https://themakunga.cachix.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= themakunga.cachix.org-1:6G4uSeEclXBILBnmlbDsTAapL2vE0ndx4laL02AzzR0=
      - uses: cachix/cachix-action@v15
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build linux-bootstrap ISO
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          echo "=> Building linux-bootstrap on $(uname -m)..."
          OUT=$(nix build .#nixosConfigurations.linux-bootstrap.config.system.build.isoImage \
            --no-link --print-out-paths 2>&1 | tail -1)
          mkdir -p output
          for f in "$OUT"/iso/*; do
            [ -f "$f" ] && cp -L "$f" "output/linux-bootstrap-${TAG}-$(basename "$f")"
          done
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: pre-linux-iso
          path: output/*
          retention-days: 3
  # ── 3. Publicar pre-release (sin CHANGELOG) ──────────────────────────────
  pre-release:
    name: Publish pre-release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build-rpi, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true
      - name: Tag and publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" output/* \
            --title "Pre-release ${TAG} (develop)" \
            --prerelease \
            --target develop \
            --generate-notes
          echo "=> $(gh release view "$TAG" --json url -q .url)"
