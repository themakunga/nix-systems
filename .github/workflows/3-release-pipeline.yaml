name: '3. Release Pipeline (Validation, Build, Publish, PR)'
on:
  push:
    branches:
      - 'release/v*'
permissions:
  contents: write
  pull-requests: write
jobs:
  pre-commit-checks:
    name: 'Run Validations & Linters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode SSH Key
        run: |
          echo "${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}" | base64 -d > /tmp/raw_ssh_key
          EOF_DELIMITER=$(openssl rand -hex 8)
          {
            echo "DECODED_KEY<<$EOF_DELIMITER"
            cat /tmp/raw_ssh_key
            echo ""
            echo "$EOF_DELIMITER"
          } >> "$GITHUB_ENV"
          rm /tmp/raw_ssh_key
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.DECODED_KEY }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Install pre-commit
        run: pipx install pre-commit
      - name: Run all checks via Makefile
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: make check
  build-rpi-bootstrap:
    name: 'Build: RPi5 Bootstrap SD Image'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Decode SSH Key
        run: |
          echo "${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}" | base64 -d > /tmp/raw_ssh_key
          EOF_DELIMITER=$(openssl rand -hex 8)
          {
            echo "DECODED_KEY<<$EOF_DELIMITER"
            cat /tmp/raw_ssh_key
            echo ""
            echo "$EOF_DELIMITER"
          } >> "$GITHUB_ENV"
          rm /tmp/raw_ssh_key
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.DECODED_KEY }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux
            extra-substituters = https://nixos-hardware.cachix.org
            extra-trusted-public-keys = nixos-hardware.cachix.org-1:OqV48MwUzN0rmApeP5Dp/4hQv+8Uz7x1qPtd+6BaLgc=
      - uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Build aperture-bootstrap SD image
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          mkdir -p output
          make build-sd HOST=aperture-bootstrap
          for file in result/sd-image/*; do
            [ -f "$file" ] && cp -L "$file" "output/aperture-bootstrap-$(basename "$file")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: image-aperture-bootstrap
          path: output/*
          retention-days: 1
  build-linux-installer:
    name: 'Build: Linux x86_64 Installer ISO'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode SSH Key
        run: |
          echo "${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}" | base64 -d > /tmp/raw_ssh_key
          EOF_DELIMITER=$(openssl rand -hex 8)
          {
            echo "DECODED_KEY<<$EOF_DELIMITER"
            cat /tmp/raw_ssh_key
            echo ""
            echo "$EOF_DELIMITER"
          } >> "$GITHUB_ENV"
          rm /tmp/raw_ssh_key
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.DECODED_KEY }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Build linux-bootstrap ISO
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          mkdir -p output
          make build-installer-x86
          for file in result/iso/*; do
            [ -f "$file" ] && cp -L "$file" "output/linux-bootstrap-$(basename "$file")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: image-linux-bootstrap
          path: output/*
          retention-days: 1
  publish-and-pr:
    name: 'Publish Release & Create PR'
    needs: [pre-commit-checks, build-rpi-bootstrap, build-linux-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Download Built Images
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: image-*
          merge-multiple: true
      - name: Publish Release & Create PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"

          echo "Publishing GitHub Release $VERSION..."
          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION already exists — updating artifacts (re-run idempotency)..."
            gh release upload "$VERSION" output/* --clobber
          else
            gh release create "$VERSION" output/* \
              --title "Release $VERSION" \
              --generate-notes
          fi

          echo "Ensuring Pull Request to main..."
          PR_EXISTS=$(gh pr list --head "release/$VERSION" --base main --json id --jq 'length')
          if [ "$PR_EXISTS" -eq "0" ]; then
            gh pr create \
              --base main \
              --head "release/$VERSION" \
              --title "🚀 Production Release Integration: $VERSION" \
              --body "### Production Release Deployment: $VERSION
              This PR integrates the released code from \`release/$VERSION\` into \`main\`.
              All checks have passed and the GitHub Release has been successfully published."
          else
            echo "PR already exists. Skipping."
          fi
