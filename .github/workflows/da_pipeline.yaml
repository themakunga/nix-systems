name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  tests:
    name: Run Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Setup SSH keys para repositorios privados
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Run Nix Flake Checks
        run: nix flake check -L
  build-image:
    name: Build RPi Images
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - device: rpi5
            target: image-rpi5
          - device: rpi02
            target: image-rpi02
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Setup SSH keys para repositorios privados
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Setup QEMU (ARM)
        uses: docker/setup-qemu-action@v3
        with:
          platform: arm64
      - name: Build SD Image
        run: |
          nix build .#packages.aarch64-linux.${{ matrix.target }} -L
          mkdir -p output
          cp -L result/sd-image/*.img.zst output/${{ matrix.device }}.img.zst
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-image
          path: output/${{ matrix.device }}.img.zst
  release:
    name: Semantic Release
    needs: build-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          featch-depth: 0
      - name: Download all Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
