name: Run nix test and build SD image
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run NIX tests
        run: nix flake check
  build-sd-image:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/head/main'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build SD Image Rasberry Pi 5
        run: |
          nix build .#packages.aarch64-linux.image-rpi5
          IMG_PATH_RPI5=$(readlink -f result/sd-image/*.img)
          echo "IMG_PATH_RPI5=$IMG_PATH_RPI5" >> $GITHUB_ENV
          echo "Image built at $IMG_PATH_RPI5"
      - name: Upload SD Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NixOS Rpi5 Image
          path: ${{ env.IMG_PATH_RPI5 }}
          if-no-file-found: error
