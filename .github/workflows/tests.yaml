name: Run nix test and build SD image
on:
  push:
    branches:
      - main
      - develop
    pull_request:
      branches:
        - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/chechout@v4
      - uses: cachix/install-nix-action@v25
        nix_path: nixpkgs=channel:nixos-unstable
      - name: Run NIX tests
        run: nix flake check
  build-sd-image:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/head/main'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build SD Image
        run: |
          nix build
