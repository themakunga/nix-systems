# =========================================================
# Archivo de Configuración de NixOS / Home Manager
# Repositorio: TheMakunga Infrastructure
# Módulo auto-gestionado.
# =========================================================
# === DOCUMENTATION ===
# File: security-scan.yaml
# Path: ./.github/workflows/security-scan.yaml
# Description: Escaneo de seguridad — credenciales expuestas y dependencias vulnerables.
#              Solo corre en develop. Abre un issue si detecta problemas; lo cierra si pasa.
# =====================
name: Security Scan
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
  issues: write
jobs:
  # ── 1. Credenciales expuestas ─────────────────────────────────────────────
  secrets-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  # ── 2. Vulnerabilidades en dependencias ───────────────────────────────────
  vuln-scan:
    name: Vulnerabilities — trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies and filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "1"
          severity: CRITICAL,HIGH
          output: trivy-report.json
          format: json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
  # ── 3. Abrir o cerrar issue según resultado ───────────────────────────────
  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [secrets-scan, vuln-scan]
    if: always()
    steps:
      - name: Create or update security issue on failure
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[security] Vulnerabilities or exposed secrets detected';
            const label = 'security';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Security scan failed',
              '',
              `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
              `**Commit:** \`${context.sha.slice(0, 7)}\``,
              `**Run:** ${runUrl}`,
              '',
              '### Failed jobs',
              '${{ needs.secrets-scan.result }}' === 'failure' ? '- ❌ **gitleaks** — exposed credentials detected' : '',
              '${{ needs.vuln-scan.result }}'    === 'failure' ? '- ❌ **trivy**    — vulnerable or misconfigured dependencies detected' : '',
              '',
              'Review the workflow run for details and download the Trivy report artifact.',
            ].filter(Boolean).join('\n');

            // search for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### New failure — ${new Date().toISOString().slice(0, 10)}\n\n${body}`,
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              console.log('Created new security issue');
            }
      - name: Close security issue if all checks pass
        if: "!contains(needs.*.result, 'failure')"
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[security] Vulnerabilities or exposed secrets detected';
            const label = 'security';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ All security checks passed on \`${context.ref.replace('refs/heads/', '')}\` (${context.sha.slice(0, 7)}). Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
              console.log(`Closed issue #${existing.number}`);
            }
