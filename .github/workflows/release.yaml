name: Release
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump (auto follows Conventional Commits)
        required: true
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  schedule:
    - cron: '0 10 * * 1'
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - scripts/release_version.py
      - scripts/collect-release-artifacts.sh
      - scripts/publish-release.sh
      - tests/test_release_pipeline.py
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'stable' }}
  cancel-in-progress: false
jobs:
  checks:
    name: Release regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release planning and publication
        run: python3 -m unittest discover -s tests -p test_release_pipeline.py
  version:
    name: Plan release from main
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      sha: ${{ steps.plan.outputs.sha }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Validate manual source branch
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main && "$SOURCE_REF" != refs/heads/develop ]]; then
            echo 'Run Release from main or develop; installers always use main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source
          ref: main
          persist-credentials: false
      - id: plan
        working-directory: source
        env:
          BUMP_TYPE: ${{ inputs.bump_type || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ../release-tools/scripts/release_version.py "$BUMP_TYPE" > release-plan.json
          version=$(jq -r .version release-plan.json)
          changed=$(jq -r .changed release-plan.json)
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ -n "$previous" ]]; then
            git merge-base --is-ancestor "$previous" HEAD
          fi
          if [[ "$changed" == false ]]; then
            if gh release view "$version" --json isDraft --jq .isDraft > release-draft.txt; then
              [[ $(cat release-draft.txt) == false ]] || changed=true
            else
              changed=true
            fi
          fi
          {
            jq -r '"version=\(.version)\nsha=\(.sha)"' release-plan.json
            echo "previous=$previous"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version, main commit $(jq -r .sha release-plan.json), pending=$changed" >> "$GITHUB_STEP_SUMMARY"
  build-rpi:
    name: Build — RPi bootstrap SD image
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: source
          ref: ${{ needs.version.outputs.sha }}
      - name: Load private-input SSH key
        env:
          CI_SSH_KEY_BASE64: ${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}
        run: bash release-tools/scripts/setup-ci-ssh.sh
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            extra-platforms = aarch64-linux
            extra-substituters = https://cache.nixos.org https://themakunga.cachix.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= themakunga.cachix.org-1:6G4uSeEclXBILBnmlbDsTAapL2vE0ndx4laL02AzzR0=
      - uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build aperture-bootstrap SD image
        working-directory: source
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          set -euo pipefail
          echo "=> Building aperture-bootstrap SD image on $(uname -m)..."
          OUT=$(nix build .#nixosConfigurations.aperture-bootstrap.config.system.build.sdImage \
            --no-link --print-out-paths)
          bash ../release-tools/scripts/collect-release-artifacts.sh rpi "$OUT/sd-image" \
            "${{ needs.version.outputs.version }}" output
          ls -lh output/
      - uses: actions/upload-artifact@v7
        with:
          name: installer-rpi
          path: source/output/*
          retention-days: 7
          if-no-files-found: error
      - name: Stop SSH agent
        if: always() && env.SSH_AGENT_PID != ''
        run: ssh-agent -k >/dev/null
  # ── 2b. Build: Linux x86_64 installer ISO ────────────────────────────────
  build-linux:
    name: Build — Linux x86_64 installer ISO
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: source
          ref: ${{ needs.version.outputs.sha }}
      - name: Load private-input SSH key
        env:
          CI_SSH_KEY_BASE64: ${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}
        run: bash release-tools/scripts/setup-ci-ssh.sh
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
          extra_nix_config: |
            extra-substituters = https://cache.nixos.org https://themakunga.cachix.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= themakunga.cachix.org-1:6G4uSeEclXBILBnmlbDsTAapL2vE0ndx4laL02AzzR0=
      - uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build linux-bootstrap ISO
        working-directory: source
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          set -euo pipefail
          echo "=> Building linux-bootstrap ISO on $(uname -m)..."
          OUT=$(nix build .#nixosConfigurations.linux-bootstrap.config.system.build.isoImage \
            --no-link --print-out-paths)
          bash ../release-tools/scripts/collect-release-artifacts.sh linux "$OUT/iso" \
            "${{ needs.version.outputs.version }}" output
          ls -lh output/
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux
          path: source/output/*
          retention-days: 7
          if-no-files-found: error
      - name: Stop SSH agent
        if: always() && env.SSH_AGENT_PID != ''
        run: ssh-agent -k >/dev/null
  release:
    name: Publish completed installers
    needs: [version, build-rpi, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: source/output
          merge-multiple: true
      - name: Publish verified release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
        run: bash ../release-tools/scripts/publish-release.sh
