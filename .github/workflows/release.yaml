name: Release

on:
  push:
    brances:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/git
      - run: semanti-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
