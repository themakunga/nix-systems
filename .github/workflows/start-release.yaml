name: "1. Start Release Train"
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Tipo de incremento para la nueva versión"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
permissions:
  contents: write
  pull-requests: write
jobs:
  create-train:
    name: "Create Pre-Release PR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Calculate Next Version
        id: calc_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "=> Último tag encontrado: $LATEST_TAG"

          VERSION_CORE="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"

          BUMP="${{ inputs.bump_type }}"

          if [ "$BUMP" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "=> Próxima versión calculada ($BUMP): $NEXT_VERSION"

          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
      - name: Find Base and Create Branches
        run: |
          # 1. Crear la rama 'release' desde producción antigua (el último tag)
          git checkout ${{ env.LATEST_TAG }}
          git checkout -b "release/${{ env.NEXT_VERSION }}"
          git push origin "release/${{ env.NEXT_VERSION }}"

          # 2. Crear la rama 'pre-release' con el código nuevo desde main
          git checkout main
          git checkout -b "pre-release/${{ env.NEXT_VERSION }}"
          git push origin "pre-release/${{ env.NEXT_VERSION }}"
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh pr create \
            --base "release/${{ env.NEXT_VERSION }}" \
            --head "pre-release/${{ env.NEXT_VERSION }}" \
            --title "🚀 Pre-Release Validation: ${{ env.NEXT_VERSION }}" \
            --body "### Release Train: ${{ env.NEXT_VERSION }}

            Este PR contiene todos los cambios desde el último pase a producción (${{ env.LATEST_TAG }}).
            Tus pipelines de validación (Nix Flake Check) se están ejecutando.

            **Instrucciones:**
            1. Espera a que los checks terminen con éxito.
            2. Haz 'Merge pull request'.
            3. Esto disparará el Build Final, Semantic Release, la mezcla a Main y la limpieza de estas ramas."
