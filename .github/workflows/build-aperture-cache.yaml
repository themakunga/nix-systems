name: 'Build & Cache aperture-science'
on:
  push:
    branches: [develop]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'modules/hosts/linux/raspberry-pi/aperture-science*.nix'
      - 'modules/modules/rpi/**'
      - 'modules/modules/nixos/**'
      - 'modules/modules/common/**'
      - 'modules/profiles/**'
      - 'modules/applications/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-cache:
    name: 'Build NixOS system and push to Cachix'
    runs-on: [self-hosted, aarch64-linux, aperture-science]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup SSH for private flake inputs
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY_BASE64 }}
      - name: Build aperture-science system
        run: |
          nix build .#nixosConfigurations.aperture-science.config.system.build.toplevel \
            --no-link \
            --print-out-paths \
            2>&1 | tee /tmp/build-out.txt
          echo "SYSTEM_PATH=$(tail -1 /tmp/build-out.txt)" >> "$GITHUB_ENV"
      - name: Push closure to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix-store -qR "$SYSTEM_PATH" | cachix push themakunga
          echo "=> Pushed $(nix-store -qR "$SYSTEM_PATH" | wc -l) paths to themakunga.cachix.org"
