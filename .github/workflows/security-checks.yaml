name: Security - Weekly Nix Flake and Secrets
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  security-scan:
    name: Secrity Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SECRETS_REPO_SSH_KEY }}
      - name: Install Nix Package Manager
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_SECRETS }}
      - name: Setup Nix with Cachix
        uses: cachix/cachix-action@v17
        with:
          name: themakunga
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Nix Flake check
        run: make check
  handle-failure:
    name: Report Failure
    runs-on: ubuntu-latest
    needs: security-scan
    if: failure()
    steps:
      - name: Create Issue
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: TheMakunga
          labels: secrets, bug
          title: Weekly Security Alerd Detected
          body: |
            Hi @themakunga,

             The weekly security scan has failed. Exposed secrets might have been detected in the Git history, or vulnerability/outdated issues were found in your `flake.lock`.

             Please review the detailed execution logs here:
             ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{secrets.RELEASE_TOKEN}}
