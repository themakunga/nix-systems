printWidth: 100
useTabs: false
tabWidth: 2
semi: true
singleQuote: true
trailingComma: 'es5'
bracketSpacing: true
htmlWhitespaceSensitivity: 'css'
endOfLine: 'lf'
overrides:
  - files: '*.yaml'
    options:
      parser: 'yaml'
      tabWidth: 2
  - files: '*.yml'
    options:
      parser: 'yaml'
      tabWidth: 2
  - files: '*.json'
    options:
      parser: 'json'
  - files: '*.md'
    options:
      parser: 'markdown'
      proseWrap: 'always'
  - files: '*.toml'
    options:
      parser: 'toml'
  - files: '*.md'
    options:
      printWidth: 80
      proseWrap: always
